# ============================================
# account.proclaw.cc Nginx 配置（Sprint 1）
# OIDC IdP 统一认证入口
#
# ⚠️  本文件当前**未生效**——主 nginx.conf 已直接内联了 account.proclaw.cc
# server block（临时复用 nvwax 的自签证书），用 docker compose up -d 即可访问。
# 本文件保留为“正式方案”骨架，等 LE 证书到位后切到本文件：
#
#   1) DNS 生效后申请 LE 证书（建议 certbot webroot 或 standalone）：
#        certbot certonly --webroot -w /var/www/certbot \
#          -d account.proclaw.cc \
#          --email <you@example.com> --agree-tos --no-eff-email
#      证书签发后实际路径：
#        /etc/letsencrypt/live/account.proclaw.cc/fullchain.pem
#        /etc/letsencrypt/live/account.proclaw.cc/privkey.pem
#   2) 在主 nginx.conf 中“临时内联 server block”里：
#        a) 改 ssl_certificate / ssl_certificate_key 为上述 LE 路径
#        b) （可选）删除临时内联 server block，并在 nginx.conf 顶部加上
#           include /etc/nginx/conf.d/*.conf; 启用本文件
#   3) docker compose restart nginx
#
# 配套：本地开发如需独立调试本文件——可手动跑：
#   docker run --rm -p 80:80 -p 443:43 -v $(pwd)/docker/nginx:/etc/nginx:ro nginx:alpine
# ============================================

# HTTP → HTTPS
server {
    listen 80;
    server_name account.proclaw.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name account.proclaw.cc;

    # SSL（Let's Encrypt 证书路径占位，证书签发后才能生效）
    # 证书签发后存在：
    #   /etc/letsencrypt/live/account.proclaw.cc/fullchain.pem
    #   /etc/letsencrypt/live/account.proclaw.cc/privkey.pem
    ssl_certificate     /etc/letsencrypt/live/account.proclaw.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.proclaw.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # OIDC IdP 端点 → 反向代理到 backend:3001
    location /oauth/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 端点包含 302 redirect + form POST，允许较长超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # OIDC Discovery & JWKS（公开）
    location /.well-known/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JWKS 公开且稳定，浏览器可缓存
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
