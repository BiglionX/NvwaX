# ============================================
# account.proclaw.cc Nginx 配置（Sprint 1）
# OIDC IdP 统一认证入口（本地开发 stub）
#
# 配套步骤：
#   1. 生成自签证书（一次）：
#      openssl req -x509 -newkey rsa:2048 -nodes \
#        -keyout docker/nginx/ssl/account.proclaw.cc.key \
#        -out docker/nginx/ssl/account.proclaw.cc.crt \
#        -days 365 -subj '/CN=account.proclaw.cc'
#   2. 本机 /etc/hosts 添加：
#      127.0.0.1   account.proclaw.cc
#   3. 启动：docker compose --profile production up nginx
# ============================================

# HTTP → HTTPS
server {
    listen 80;
    server_name account.proclaw.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name account.proclaw.cc;

    # SSL（自签证书，仅本地开发用）
    ssl_certificate     /etc/nginx/ssl/account.proclaw.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/account.proclaw.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # OIDC IdP 端点 → 反向代理到 backend:3001
    location /oauth/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 端点包含 302 redirect + form POST，允许较长超时
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # OIDC Discovery & JWKS（公开）
    location /.well-known/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JWKS 公开且稳定，浏览器可缓存
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
