services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nvwax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nvwax}
      POSTGRES_USER: ${DB_USER:-nvwax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/nvwax-server/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nvwax} -d ${DB_NAME:-nvwax}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nvwax-network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nvwax-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-nvwax}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-nvwax}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string}
      REDIS_URL: redis://redis:6379
      
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
      
      # Facebook OAuth
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      
      # AI Model
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      
      # Payment
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      
      # Security
      CROSS_AUTH_SECRET: ${CROSS_AUTH_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      # Sprint 1 — OIDC IdP
      OIDC_ISSUER: ${OIDC_ISSUER:-https://account.proclaw.cc}
      OIDC_PRIVATE_KEY_PATH: ${OIDC_PRIVATE_KEY_PATH:-}
      # Sprint 2 — pc_session cookie + email channel
      PC_SESSION_SECRET: ${PC_SESSION_SECRET:-dev-only-pc-session-secret}
      PC_SESSION_COOKIE_DOMAIN: ${PC_SESSION_COOKIE_DOMAIN:-.proclaw.cc}
      # Sprint 2.10 — account-portal static export directory (Next.js output:'export')
      PORTAL_STATIC_DIR: ${PORTAL_STATIC_DIR:-/app/account-portal-out}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-ProClaw 团队 <noreply@account.proclaw.cc>}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Phase 2/3 — 编排与执行委托
      WORKFLOW_API_URL: http://skillhub:3002/api
      EXECUTOR_URL: http://executor:3010
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skillhub:
        condition: service_started
      executor:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      # Sprint 1 — OIDC IdP RSA-2048 keypair (mounted from /opt/nvwax/secrets/oidc/)
      # Generated by scripts/generate-oidc-keys.sh
      - /opt/nvwax/secrets/oidc/private.pem:/etc/oidc/keys/private.pem:ro
      - /opt/nvwax/secrets/oidc/private.pem.pub.pem:/etc/oidc/keys/private.pub.pem:ro
      # Sprint 2.10 — account-portal static export (Next.js output:'export')
      - /opt/nvwax/account-portal-out:/app/account-portal-out:ro
    networks:
      - nvwax-network

  # Frontend Web Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nvwax.proclaw.cc/api}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        # OIDC / SSO（Sprint 2.12：浏览器侧 OIDC 流程必需，构建期烤进 bundle）
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-https://account.proclaw.cc}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-proclaw-web}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-https://nvwax.proclaw.cc/oauth/callback}
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI:-https://nvwax.proclaw.cc}
        NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-openid profile email}
        NEXT_PUBLIC_OIDC_ADMIN_CLIENT_ID: ${NEXT_PUBLIC_OIDC_ADMIN_CLIENT_ID:-nvwax-admin}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nvwax.proclaw.cc}
    container_name: nvwax-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nvwax.proclaw.cc/api}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      # OIDC 运行期配置（服务端 API Route 读 process.env）
      OIDC_SESSION_SECRET: ${OIDC_SESSION_SECRET:?OIDC_SESSION_SECRET must be set in .env (openssl rand -base64 32)}
      NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-https://account.proclaw.cc}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-proclaw-web}
      NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-https://nvwax.proclaw.cc/oauth/callback}
      NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI:-https://nvwax.proclaw.cc}
      NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-openid profile email}
      NEXT_PUBLIC_OIDC_ADMIN_CLIENT_ID: ${NEXT_PUBLIC_OIDC_ADMIN_CLIENT_ID:-nvwax-admin}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nvwax.proclaw.cc}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - nvwax-network

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: nvwax-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nvwax-network

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: nvwax-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Sprint 1 — OIDC IdP 路由 + self-signed SSL
      - ./docker/nginx/account.proclaw.cc.conf:/etc/nginx/conf.d/account.proclaw.cc.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      # Sprint 1 — Let's Encrypt 证书（certbot 签发后从宿主机 /etc/letsencrypt/ 挂入容器）
      # 续期后 certbot 只需 update 宿主机文件，容器内自动可见，重启 nginx 生效
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nvwax-network

  # Sprint 2 — MailPit (SMTP sink for dev/test e2e). NOT used in production.
  # Web UI on http://localhost:8025  •  SMTP on :1025 (no auth).
  mailpit:
    image: axllent/mailpit:latest
    container_name: nvwax-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - nvwax-network

  # Phase 2 — SkillHub Workflow Engine（编排内核 + YAML 工作流）
  skillhub:
    build:
      context: .
      dockerfile: Dockerfile.skillhub
    container_name: nvwax-skillhub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DATABASE_PATH: /app/data/workflows.db
    ports:
      - "3002:3002"
    volumes:
      - skillhub_data:/app/data
    networks:
      - nvwax-network

  # Phase 3 — 隔离执行 worker（nvwax-executor，零依赖）
  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    container_name: nvwax-executor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      EXECUTOR_PORT: 3010
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      EXECUTOR_ALLOWED_ROOTS: /app
    ports:
      - "3010:3010"
    networks:
      - nvwax-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  skillhub_data:
    driver: local

networks:
  nvwax-network:
    driver: bridge
