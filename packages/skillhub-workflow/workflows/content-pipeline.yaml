workflow:
  id: content-pipeline
  name: 内容创作流水线
  description: 从策略规划到内容创作再到发布的完整内容生产流水线
  version: 1.0.0
  
  nodes:
    - id: strategy
      agent: content-strategist
      input: "{{user_requirement}}"
      
    - id: writing
      type: llm
      input: "{{strategy.output}}"
      depends_on: [strategy]
      params:
        prompt: "基于以下策略，撰写高质量的营销文案：{{strategy.output}}"
        model: deepseek-chat
        temperature: 0.7
      
    - id: design
      type: llm
      input: "{{strategy.output}}"
      depends_on: [strategy]
      params:
        prompt: "基于以下策略，提供视觉设计方案和素材建议：{{strategy.output}}"
        model: deepseek-chat
        temperature: 0.5
      
    - id: review
      agent: content-strategist
      input: "{{writing.output}} + {{design.output}}"
      depends_on: [writing, design]
      human_approval: true
      params:
        prompt: "审核以下内容是否符合策略要求，并给出修改建议"
  
  edges:
    - from: strategy
      to: writing
    - from: strategy
      to: design
    - from: writing
      to: review
    - from: design
      to: review
