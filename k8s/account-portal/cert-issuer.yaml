# ClusterIssuer for Let's Encrypt (production).
# cert-manager ≥ v1.13 required.
# Reference: https://cert-manager.io/docs/configuration/acme/

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: proclaw
    app.kubernetes.io/managed-by: sprint2-agent
spec:
  acme:
    # Cloudflare DNS-01 solver — needed because account.proclaw.cc may be on
    # Cloudflare's edge and we want wildcard-friendly certs.
    # Switch to http01 + ingress if Cloudflare creds are unavailable.
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@proclaw.cc               # replace with the real contact
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            email: ops@proclaw.cc
            # API token stored as K8s secret (Cloudflare → My Profile → API Tokens → Edit zone DNS)
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - proclaw.cc
      - http01:
          ingress:
            class: nginx
