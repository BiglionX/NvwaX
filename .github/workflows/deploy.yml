name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-archive/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 43.156.133.180
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            if [ ! -d /opt/nvwax ]; then
              echo "📦 First deployment - cloning repository..."
              sudo mkdir -p /opt/nvwax
              sudo chown ubuntu:ubuntu /opt/nvwax
              git clone https://github.com/BiglionX/NvwaX.git /opt/nvwax
            fi
            cd /opt/nvwax
            echo "🧹 Discarding local changes..."
            git fetch origin main
            git reset --hard origin/main
            echo "📥 Pulling latest code..."
            git pull origin main
            echo "🔐 Setting up environment secrets..."
            # 使用 sed 替换已有值或追加新值，确保每次部署都更新
            for key in GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_CLIENT_ID DEEPSEEK_API_KEY JWT_SECRET STRIPE_SECRET_KEY CROSS_AUTH_SECRET ADMIN_JWT_SECRET; do
              case "$key" in
                GOOGLE_CLIENT_ID) val="${{ secrets.GOOGLE_CLIENT_ID }}" ;;
                NEXT_PUBLIC_GOOGLE_CLIENT_ID) val="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" ;;
                DEEPSEEK_API_KEY) val="${{ secrets.DEEPSEEK_API_KEY }}" ;;
                JWT_SECRET) val="${{ secrets.JWT_SECRET }}" ;;
                STRIPE_SECRET_KEY) val="${{ secrets.STRIPE_SECRET_KEY }}" ;;
                CROSS_AUTH_SECRET) val="${{ secrets.CROSS_AUTH_SECRET }}" ;;
                ADMIN_JWT_SECRET) val="${{ secrets.ADMIN_JWT_SECRET }}" ;;
              esac
              if grep -q "^${key}=" /opt/nvwax/.env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" /opt/nvwax/.env
              else
                echo "${key}=${val}" >> /opt/nvwax/.env
              fi
            done
            echo " Stopping old containers..."
            docker-compose down
            echo " Building and starting containers..."
            docker-compose up -d --build
            echo " Waiting for services to start..."
            sleep 30
            echo "✅ Checking service status..."
            docker-compose ps
            echo "📋 Backend container logs..."
            docker logs nvwax-backend --tail 100 2>&1 || true
            echo "🏥 Checking health..."
            for i in 1 2 3; do
              echo "Attempt $i: backend health check..."
              curl -f http://localhost:3001/health && break
              sleep 10
            done || echo "Backend health check failed"
            curl -f http://localhost:3000/api/health || echo "Frontend health check failed"
            echo "🎉 Deployment completed successfully!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo " Deployment failed!"
          fi
