name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-archive/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 43.156.133.180
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30m
          script: |
            set -e
            echo "🚀 Starting deployment..."
            if [ ! -d /opt/nvwax ]; then
              echo "📦 First deployment - cloning repository..."
              sudo mkdir -p /opt/nvwax
              sudo chown ubuntu:ubuntu /opt/nvwax
              git clone https://github.com/BiglionX/NvwaX.git /opt/nvwax
            fi
            cd /opt/nvwax
            echo "🧹 Discarding local changes..."
            git fetch origin main
            git reset --hard origin/main
            echo "📥 Pulling latest code..."
            git pull origin main
            echo "🔐 Setting up environment secrets..."
            # 使用 sed 替换已有值或追加新值，确保每次部署都更新
            for key in GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_CLIENT_ID DEEPSEEK_API_KEY JWT_SECRET STRIPE_SECRET_KEY CROSS_AUTH_SECRET ADMIN_JWT_SECRET PC_SESSION_SECRET OIDC_SESSION_SECRET OIDC_PRIVATE_KEY_PATH SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
              case "$key" in
                GOOGLE_CLIENT_ID) val="${{ secrets.GOOGLE_CLIENT_ID }}" ;;
                NEXT_PUBLIC_GOOGLE_CLIENT_ID) val="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" ;;
                DEEPSEEK_API_KEY) val="${{ secrets.DEEPSEEK_API_KEY }}" ;;
                JWT_SECRET) val="${{ secrets.JWT_SECRET }}" ;;
                STRIPE_SECRET_KEY) val="${{ secrets.STRIPE_SECRET_KEY }}" ;;
                CROSS_AUTH_SECRET) val="${{ secrets.CROSS_AUTH_SECRET }}" ;;
                ADMIN_JWT_SECRET) val="${{ secrets.ADMIN_JWT_SECRET }}" ;;
                PC_SESSION_SECRET) val="${{ secrets.PC_SESSION_SECRET }}" ;;
                OIDC_SESSION_SECRET) val="${{ secrets.OIDC_SESSION_SECRET }}" ;;
                OIDC_PRIVATE_KEY_PATH) val="${{ secrets.OIDC_PRIVATE_KEY_PATH }}" ;;
                SMTP_HOST) val="${{ secrets.SMTP_HOST }}" ;;
                SMTP_PORT) val="${{ secrets.SMTP_PORT }}" ;;
                SMTP_USER) val="${{ secrets.SMTP_USER }}" ;;
                SMTP_PASS) val="${{ secrets.SMTP_PASS }}" ;;
                SMTP_FROM) val="${{ secrets.SMTP_FROM }}" ;;
              esac
              # 仅当 secret 实际有值时才更新（避免空值覆盖已有配置）
              if [ -z "$val" ]; then
                echo "⏭️  Skipping $key (empty in GitHub Secrets)"
                continue
              fi
              if grep -q "^${key}=" /opt/nvwax/.env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" /opt/nvwax/.env
              else
                echo "${key}=${val}" >> /opt/nvwax/.env
              fi
            done
            echo "🔑 Ensuring OIDC_SESSION_SECRET (frontend session-cookie encryption key)..."
            # docker-compose.yml 用 ${OIDC_SESSION_SECRET:?...} 强制要求该变量；
            # 若 GitHub Secret 未配置且 .env 里也没有，则自动生成一份并持久化到 .env。
            if ! grep -q '^OIDC_SESSION_SECRET=' /opt/nvwax/.env 2>/dev/null; then
              echo "OIDC_SESSION_SECRET=$(openssl rand -base64 32)" >> /opt/nvwax/.env
              echo "  ✅ Generated OIDC_SESSION_SECRET (persisted in /opt/nvwax/.env)"
            else
              echo "  ✅ OIDC_SESSION_SECRET already present in /opt/nvwax/.env"
            fi
            echo "🔐 Generating OIDC keys (if missing)..."
            bash /opt/nvwax/scripts/generate-oidc-keys.sh
            echo "🧹 Fixing ownership of runtime artifact dirs (root-owned files break docker build context + portal static serving)..."
            sudo chown -R ubuntu:ubuntu /opt/nvwax/account-portal-out /opt/nvwax/portal-new /opt/nvwax/portal-out /opt/nvwax/portal-out-new 2>/dev/null || true
            echo " Stopping old containers..."
            docker-compose down
            echo " Building and starting containers..."
            docker-compose up -d --build
            echo " Waiting for services to start..."
            sleep 30
            echo "✅ Checking service status..."
            docker-compose ps
            echo "📋 Backend container logs..."
            docker logs nvwax-backend --tail 100 2>&1 || true
            echo "🏥 Checking health..."
            for i in 1 2 3; do
              echo "Attempt $i: backend health check..."
              curl -f http://localhost:3001/health && break
              sleep 10
            done || echo "Backend health check failed"
            curl -f http://localhost:3000/api/health || echo "Frontend health check failed"
            echo "🎉 Deployment completed successfully!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo " Deployment failed!"
          fi
